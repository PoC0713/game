<!doctype html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Ecosystem Restored</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <header>
            <h1>ECOSYSTEM RESTORED</h1>
            <div>RESOURCE <b id="resource">20</b>/50 <button id="undo">↩ 一つ戻る</button><button id="pause">⏸ PAUSE</button> <button id="speed">▶ 1×</button></div>
        </header>
        <section>
            <aside>
                <h2>環境</h2>
                <p>🌿 <span id="grass">0</span>　🌳 <span id="forest">0</span>　🟤 <span id="swamp">0</span></p>
                <p>💧 <span id="source">0</span>　🩵 <span id="waterway">0</span></p>
                <h2>生物</h2>
                <p>🐟0 🐸0 🦋0 🐰0 🐍0 🐦0 🐝0 🦌0 🐻0</p>
                <h2>生態系再生条件</h2>
                <div id="conditions">
                    <p id="cond-grass">🌿 草地 0 / 25</p>
                    <p id="cond-forest">🌳 森 0 / 23</p>
                    <p id="cond-fish">🐟 魚 0 / 10</p>
                    <p id="cond-rabbit">🐰 ウサギ 0 / 7</p>
                    <p id="cond-insect">🦋 昆虫 0 / 15</p>
                    <p id="cond-snake">🐍 ヘビ 0 / 3</p>
                    <p id="cond-deer">🦌 鹿 0 / 4</p>
                    <p id="cond-bear">🐻 熊 0 / 2</p>
                    <p id="cond-source">💧 水源 0 / 3–4</p>
                    <p id="cond-device">🔧 人工物 0 / 0</p>
                    <p id="cond-time">⏱️ 維持 0.0 / 10秒</p>
                </div>
            </aside>
            <div id="map"></div>
        </section>
        <footer><button data-device="waterway">🩵 水路 1</button><button data-device="purification">💧 浄化
                3</button><button data-device="greening">🌿 緑化 5</button><button data-device="planting" disabled>🌳 植林
                10</button><button data-device="remove">🗑 撤去</button></footer>
    </main>
    <script src="script.js"></script>
</body>

</html>
