<!doctype html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Ecosystem Restored</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <header>
            <h1>ECOSYSTEM RESTORED</h1>
            <div>RESOURCE <b id="resource">20</b>/50 <button id="pause">⏸ PAUSE</button></div>
        </header>
        <section>
            <aside>
                <h2>ENVIRONMENT</h2>
                <p>🌿 <span id="grass">0</span>　🌳 <span id="forest">0</span>　🟤 <span id="swamp">0</span></p>
                <p>💧 <span id="source">0</span>　🩵 <span id="waterway">0</span></p>
                <h2>ANIMALS</h2>
                <p>🐟0 🐸0 🦋0 🐰0 🐍0 🐦0 🐝0 🦌0 🐻0</p>
            </aside>
            <div id="map"></div>
        </section>
        <footer><button data-device="waterway">🩵 水路 1</button><button data-device="purification">💧 浄化
                3</button><button data-device="greening">🌿 緑化 5</button><button data-device="planting" disabled>🌳 植林
                10</button><button data-device="remove">🗑 撤去</button></footer>
    </main>
    <script src="script.js"></script>
</body>

</html>
